[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuccaro-adder"
version = "1.0.0"
description = "Gate-by-gate Cuccaro ripple-carry addition and resource analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["qiskit>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
demo = ["jupyterlab>=4", "matplotlib>=3.8", "pylatexenc>=2.10", "numpy>=1.26", "nbclient>=0.10", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cuccaro_adder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The first notebook cell locates the source checkout before importing it.
"notebooks/*.ipynb" = ["E402"]
